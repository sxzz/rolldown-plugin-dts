minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # 7 days
trustPolicyExcludePrune: true
trustPolicyExclude:
  - tsrs
shellEmulator: true

overrides:
  '@volar/language-core': 'catalog:'
  '@volar/typescript': 'catalog:'
  rolldown: 'catalog:'

