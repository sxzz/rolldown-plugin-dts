  '@sxzz/eslint-config': ^8.9.2
  '@sxzz/prettier-config': ^2.4.0
  '@sxzz/test-utils': ^0.5.20
  '@ts-macro/language-plugin': ^0.3.7
  '@ts-macro/tsc': ^0.3.7
  '@types/node': ^26.6.11
  '@volar/language-core': ^2.4.31
  '@volar/typescript': ^2.4.31
  '@vue/language-core': ^3.3.14
  arktype: ^2.2.10
  bumpp: ^12.3.0
  eslint: ^10.15.0
  prettier: ^3.10.1
  rolldown: ^1.3.4
  ts-macro: ^0.3.7
  tsdown: ^0.23.7
  tsnapi: ^1.6.1
  tsrs: 7.1.0-beta.tsrs5
  typescript: ^6.0.3
  typescript-next: 'npm:typescript@7.1.0-dev.20261121.1'
  vitest: ^5.1.2
